  status = 301
  force = true
[[redirects]]
  from = "/insights/planning-a-south-florida-condo-renovation.html"
  to = "/insights/planning-a-south-florida-condo-renovation"
  status = 301
  force = true
[[redirects]]
  from = "/insights/how-3d-visualization-reduces-decision-risk.html"
  to = "/insights/how-3d-visualization-reduces-decision-risk"
  status = 301
  force = true

# Pretty-URL redirects so /projects, /about, /contact, /services resolve to .html
[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
[[redirects]]
  from = "/services/residential"
  to = "/services/residential.html"
  status = 200
[[redirects]]
  from = "/services/condo-penthouse"
  to = "/services/condo-penthouse.html"
  status = 200
[[redirects]]
  from = "/insights"
  to = "/insights/index.html"
  status = 200
[[redirects]]
  from = "/insights/miami-luxury-condo-interior-design-process"
  to = "/insights/miami-luxury-condo-interior-design-process.html"
  status = 200
[[redirects]]
  from = "/insights/planning-a-south-florida-condo-renovation"
  to = "/insights/planning-a-south-florida-condo-renovation.html"
  status = 200
[[redirects]]
